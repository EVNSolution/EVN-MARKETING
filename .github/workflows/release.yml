name: Marketing release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release current main or roll back to the host's stored previous release
        type: choice
        options: [release, rollback]
        required: true
      source_sha:
        description: Exact current main SHA (also selects the approved controller bundle for rollback)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: evn-marketing-production
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'EVNSolution/EVN-MARKETING' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    # Must be configured with required reviewers, no self-approval and main-only deployment rules.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ''
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '1'
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_ACTION: ${{ inputs.action }}
      MARKETING_AWS_ACCOUNT_ID: ${{ vars.MARKETING_AWS_ACCOUNT_ID }}
      MARKETING_INSTANCE_ID: ${{ vars.MARKETING_INSTANCE_ID }}
      MARKETING_SSM_DOCUMENT_VERSION: ${{ vars.MARKETING_SSM_DOCUMENT_VERSION }}
      MARKETING_SSM_DOCUMENT_SHA256: ${{ vars.MARKETING_SSM_DOCUMENT_SHA256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact main source and activation configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/aws/release.py validate
      - name: Check cloud boundary locally
        run: |
          python3 tests/cloud-release.test.py
          python3 tests/deploy-controller.test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.action == 'release'
        with:
          node-version: 22
          cache: npm
      - name: Check release source and runtime dependencies
        if: inputs.action == 'release'
        timeout-minutes: 15
        run: |
          npm ci
          npx prisma generate
          npm run test:schema && npm run test:data-recovery && npm run test:server-runtime && npm run test:worker-runtime && npm run test:worker-health && npm run test:worker-processes && npm run test:upload-security && npm run test:upload-processes && npm run test:release-routing && npm run test:db && npm run test:inquiries && npm run test:warp-delivery && npm run test:integration-contract && npm run typecheck && npm run lint
          npm audit --omit=dev --audit-level=high
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MARKETING_AWS_ACCOUNT_ID }}:role/EVN-Marketing-Release
          allowed-account-ids: ${{ vars.MARKETING_AWS_ACCOUNT_ID }}
          role-session-name: marketing-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ap-northeast-2
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Publish or reuse the immutable source image
        id: image
        if: inputs.action == 'release'
        timeout-minutes: 35
        run: |
          set -euo pipefail
          registry="$MARKETING_AWS_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com"
          image="$registry/evn-marketing:$SOURCE_SHA"
          # Abort on permission/network errors; only an absent tag permits a new build.
          mode=$(aws ecr describe-repositories --repository-names evn-marketing --query 'repositories[0].imageTagMutability' --output text)
          test "$mode" = IMMUTABLE
          if aws ecr describe-images --repository-name evn-marketing --image-ids "imageTag=$SOURCE_SHA" > "$RUNNER_TEMP/marketing-image.json" 2> "$RUNNER_TEMP/marketing-image-error"; then
            echo 'Reusing the existing immutable source image.'
          else
            if ! grep -q '(ImageNotFoundException)' "$RUNNER_TEMP/marketing-image-error"; then
              echo 'Cannot determine source image state.' >&2
              exit 1
            fi
            docker build --platform linux/amd64 --build-arg "MARKETING_BUILD_REVISION=$SOURCE_SHA" \
              --label "org.opencontainers.image.revision=$SOURCE_SHA" \
              --label "org.opencontainers.image.source=https://github.com/EVNSolution/EVN-MARKETING" \
              --label "org.opencontainers.image.url=https://github.com/EVNSolution/EVN-MARKETING/actions/runs/$GITHUB_RUN_ID" \
              -t "$image" .
            command -v docker-credential-ecr-login >/dev/null
            export DOCKER_CONFIG AWS_ECR_DISABLE_CACHE=true
            DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/marketing-docker.XXXXXX")
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            # Configuration contains a helper name only, never a registry token.
            printf '{"credHelpers":{"%s":"ecr-login"}}\n' "$registry" > "$DOCKER_CONFIG/config.json"
            docker push "$image"
            aws ecr describe-images --repository-name evn-marketing --image-ids "imageTag=$SOURCE_SHA" > "$RUNNER_TEMP/marketing-image.json"
          fi
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          images = json.loads((Path(os.environ['RUNNER_TEMP']) / 'marketing-image.json').read_text())['imageDetails']
          assert len(images) == 1
          digest = images[0]['imageDigest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest + '\n')
          PY
      - name: Scan and invoke the pinned Marketing document; wait for completion
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_ACTION" = rollback ]; then IMAGE_DIGEST=previous; fi
          python3 deploy/aws/release.py dispatch "$IMAGE_DIGEST"
