name: Marketing CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Homepage intake and duplicate submission checks
        run: npm run test:landing
      - name: External dashboard read-only collection and private storage
        run: npm run test:external-dashboard
      - name: Release controller and cloud declaration checks
        run: python3 tests/start-release.test.py && python3 tests/release-artifact.test.py && python3 tests/selective-ci.test.py && python3 tests/ci-images.test.py && python3 tests/deploy-controller.test.py && python3 tests/cloud-release.test.py && python3 tests/server-foundation.test.py && python3 tests/manual-release.test.py && python3 tests/operator-release.test.py && python3 tests/landing-expand.test.py && python3 tests/deploy-controller-lab.py --self-test
      - name: Offline backup and bounded receipt recovery
        run: npm run test:backup && npm run test:warp-recovery
      - run: npm run test:schema && npm run test:data-recovery && npm run test:server-runtime && npm run test:worker-runtime && npm run test:worker-health && npm run test:worker-processes && npm run test:upload-security && npm run test:upload-processes && npm run test:release-routing && npm run test:db && npm run test:inquiries && npm run test:warp-delivery && npm run test:integration-contract && npm run typecheck && npm run lint
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'ci' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify expensive checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/classify_pr.py
      - name: Require a complete automated check selection
        env:
          CHECK_COMPAT: ${{ steps.changes.outputs.compat }}
          CHECK_CONTROLLER: ${{ steps.changes.outputs.controller }}
        run: |
          case "$CHECK_COMPAT:$CHECK_CONTROLLER" in
            true:true|true:false|false:true|false:false) ;;
            *) echo 'Invalid CI check selection'; exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build runtime once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          target: runtime
          build-args: MARKETING_BUILD_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: evn-marketing:ci
          cache-from: type=gha,scope=marketing-runtime
          cache-to: type=gha,mode=max,scope=marketing-runtime
      - name: Cache test proxy
        if: steps.changes.outputs.compat == 'true' || steps.changes.outputs.controller == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          file: deploy/Dockerfile.proxy
          tags: evn-marketing:proxy-ci
          cache-from: type=gha,scope=marketing-proxy
          cache-to: type=gha,mode=max,scope=marketing-proxy
      - name: Authenticate the protected main publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: arn:aws:iam::${{ vars.MARKETING_AWS_ACCOUNT_ID }}:role/EVN-Marketing-Release
          allowed-account-ids: ${{ vars.MARKETING_AWS_ACCOUNT_ID }}
          role-session-name: marketing-ci-${{ github.run_id }}
          aws-region: ap-northeast-2
          unset-current-credentials: true
      - name: Run automatically selected checks and prepare release
        timeout-minutes: 25
        env:
          CHECK_COMPAT: ${{ steps.changes.outputs.compat }}
          CHECK_CONTROLLER: ${{ steps.changes.outputs.controller }}
          MARKETING_AWS_ACCOUNT_ID: ${{ vars.MARKETING_AWS_ACCOUNT_ID }}
        uses: ./.github/actions/check-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: marketing-ci-timings-${{ github.sha }}
          path: ${{ runner.temp }}/marketing-ci-timings.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && steps.changes.outputs.compat == 'true'
        with:
          name: marketing-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/marketing-recovery-summary.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: marketing-release-${{ github.sha }}
          path: release-receipt.json
          if-no-files-found: error
          retention-days: 30
