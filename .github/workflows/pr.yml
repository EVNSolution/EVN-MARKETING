name: PR checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:server-runtime && npm run test:db && npm run test:inquiries && npm run test:warp-delivery && npm run test:integration-contract && npm run typecheck
      - run: docker build -t evn-marketing:ci .
      - name: Synthetic container smoke
        run: |
          mkdir -p "$RUNNER_TEMP/marketing-smoke"
          chmod 777 "$RUNNER_TEMP/marketing-smoke"
          docker run --rm --network none -v "$PWD:/src:ro" -v "$RUNNER_TEMP/marketing-smoke:/data" evn-marketing:ci node /src/tests/container-smoke.mjs
          if docker run --rm --network none -v "$RUNNER_TEMP/marketing-smoke:/data" -e DATABASE_URL=file:/data/marketing.db evn-marketing:ci node worker.mjs; then exit 1; fi
          docker run -d --name marketing-smoke --network none -v "$RUNNER_TEMP/marketing-smoke:/data" \
            -e AUTH_SECRET=synthetic-ci-only-secret-at-least-32-characters \
            -e AUTH_TRUST_HOST=true -e AUTH_URL=http://127.0.0.1:3100 \
            -e DATABASE_URL=file:/data/marketing.db -e UPLOADS_DIR=/data/uploads \
            -e WARP_DELIVERY_ENABLED=false evn-marketing:ci
          trap 'docker logs marketing-smoke; docker rm -f marketing-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec marketing-smoke node -e "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then exit 0; fi
            sleep 2
          done
          exit 1
